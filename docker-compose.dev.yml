# Development overlay with hot reload on both services.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The frontend runs Vite's dev server (port 5173) instead of nginx and proxies
# /api to the backend container.

name: hermes

services:
  backend:
    build:
      context: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    volumes:
      - ./backend/app:/app/app
      - hermes-data:/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  frontend-node-modules:
