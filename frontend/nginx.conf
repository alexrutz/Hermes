server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Page images can be several MB each; uploads are whole PDFs.
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: buffering here would hold back every token until the response
        # completes, which defeats streaming entirely.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # A cold prefill over 200k tokens genuinely takes minutes.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Rendered page images are content-addressed by page id and never change.
    location ~* ^/api/collections/.*/image$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
